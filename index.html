<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI株価予測 | 米国株・ETFアナライザー</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0e1a;color:#e2e8f0;min-height:100vh}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}

/* HEADER */
header{background:linear-gradient(135deg,#0d1630,#1a2744);border-bottom:1px solid #1e2d4a;padding:16px 20px;position:sticky;top:0;z-index:200;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0;text-decoration:none;cursor:pointer}
.logo-icon{font-size:28px}
.logo-title{font-size:16px;font-weight:800;background:linear-gradient(135deg,#60a5fa,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.logo-sub{font-size:10px;color:#475569;letter-spacing:.06em;margin-top:1px}
.search-wrap{flex:1;min-width:260px;position:relative}
.search-box{display:flex;align-items:center;background:#12192c;border:1.5px solid #1e2d4a;border-radius:12px;padding:0 8px 0 14px;transition:border-color .2s;gap:6px}
.search-box:focus-within{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.search-icon{font-size:15px;opacity:.5;flex-shrink:0}
.search-box input{flex:1;background:none;border:none;outline:none;color:#e2e8f0;font-size:14px;padding:11px 0;min-width:0}
.search-box input::placeholder{color:#475569}
#searchBtn{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:700;transition:opacity .2s;white-space:nowrap;flex-shrink:0}
#searchBtn:hover{opacity:.85}

/* AUTOCOMPLETE */
.autocomplete{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#12192c;border:1.5px solid #1e2d4a;border-radius:12px;max-height:320px;overflow-y:auto;display:none;z-index:400;box-shadow:0 12px 32px rgba(0,0,0,.5)}
.autocomplete.show{display:block}
.ac-item{display:flex;align-items:center;gap:10px;padding:11px 16px;cursor:pointer;transition:background .12s;border-bottom:1px solid #0d1630}
.ac-item:last-child{border-bottom:none}
.ac-item:hover{background:#1a2744}
.ac-ticker{font-weight:800;font-size:14px;color:#60a5fa;min-width:62px}
.ac-name{font-size:12px;color:#94a3b8;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1}
.ac-type{font-size:11px;padding:2px 8px;border-radius:4px;flex-shrink:0}
.ac-type.stock{background:#0d2540;color:#60a5fa}
.ac-type.etf{background:#1a0d40;color:#a78bfa}

/* MAIN */
main{max-width:1200px;margin:0 auto;padding:24px 16px 60px}

/* HOME HERO */
.home-hero{text-align:center;padding:52px 20px 36px}
.home-hero h1{font-size:clamp(22px,4vw,38px);font-weight:900;background:linear-gradient(135deg,#60a5fa,#818cf8,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:12px;line-height:1.2}
.home-hero p{font-size:15px;color:#64748b;max-width:520px;margin:0 auto 10px;line-height:1.7}

/* POPULAR */
.section-label{font-size:11px;font-weight:700;color:#475569;letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px;padding-left:2px}
.popular-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:28px}
.pop-card{background:#12192c;border:1.5px solid #1e2d4a;border-radius:12px;padding:14px 12px;cursor:pointer;transition:all .2s;text-align:center}
.pop-card:hover{border-color:#3b82f6;transform:translateY(-2px);box-shadow:0 6px 20px rgba(59,130,246,.18)}
.pop-ticker{font-weight:800;font-size:15px;color:#e2e8f0;margin-bottom:3px}
.pop-name{font-size:10px;color:#64748b;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;margin-bottom:6px}
.pop-type{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;display:inline-block}
.pop-type.stock{background:#0d2540;color:#60a5fa}
.pop-type.etf{background:#1a0d40;color:#a78bfa}

/* HOW-TO */
.howto-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:24px}
.howto-card{background:#12192c;border:1.5px solid #1e2d4a;border-radius:14px;padding:22px;text-align:center}
.howto-icon{font-size:30px;margin-bottom:10px}
.howto-title{font-weight:700;font-size:14px;color:#e2e8f0;margin-bottom:5px}
.howto-desc{font-size:12px;color:#64748b;line-height:1.6}

/* LOADING */
.loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:400px;gap:16px}
.spinner{width:52px;height:52px;border:3px solid #1e2d4a;border-top-color:#3b82f6;border-radius:50%;animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:#64748b;font-size:14px}
.loading-sym{font-weight:700;color:#60a5fa}

/* BACK BTN */
.back-btn{display:inline-flex;align-items:center;gap:6px;background:none;border:1.5px solid #1e2d4a;color:#94a3b8;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;transition:all .2s;margin-bottom:18px}
.back-btn:hover{border-color:#3b82f6;color:#60a5fa;background:#0d1630}

/* STOCK HEADER */
.stock-header{background:#12192c;border:1.5px solid #1e2d4a;border-radius:16px;padding:22px 24px;margin-bottom:16px;display:flex;align-items:center;flex-wrap:wrap;gap:16px;justify-content:space-between}
.stock-symbol{font-size:30px;font-weight:900;color:#e2e8f0;letter-spacing:.02em}
.stock-name{font-size:14px;color:#64748b;margin-top:2px}
.stock-badge{font-size:11px;background:#1e2d4a;color:#94a3b8;padding:3px 9px;border-radius:5px;display:inline-block;margin-top:7px;font-weight:600}
.stock-price{font-size:34px;font-weight:900;text-align:right}
.stock-change{font-size:15px;font-weight:700;margin-top:4px;text-align:right}
.up{color:#10b981}
.down{color:#ef4444}

/* PREDICTION */
.pred-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:680px){.pred-row{grid-template-columns:1fr}}
.pred-card{background:#12192c;border:1.5px solid #1e2d4a;border-radius:16px;padding:24px}
.card-label{font-size:11px;font-weight:700;color:#475569;letter-spacing:.08em;text-transform:uppercase;margin-bottom:16px}
.pred-inner{display:flex;flex-direction:column;align-items:center;gap:14px}
.pred-badge{font-size:42px;font-weight:900;letter-spacing:.05em;padding:10px 36px;border-radius:16px}
.pred-badge.buy{background:linear-gradient(135deg,#064e3b,#059669);color:#fff;box-shadow:0 6px 24px rgba(16,185,129,.3)}
.pred-badge.sell{background:linear-gradient(135deg,#7f1d1d,#dc2626);color:#fff;box-shadow:0 6px 24px rgba(239,68,68,.3)}
.pred-badge.hold{background:linear-gradient(135deg,#78350f,#d97706);color:#fff;box-shadow:0 6px 24px rgba(245,158,11,.3)}
.pred-label{font-size:14px;font-weight:600;margin-top:-8px}
.pred-label.buy{color:#34d399}
.pred-label.sell{color:#f87171}
.pred-label.hold{color:#fbbf24}
.pred-conf{font-size:20px;font-weight:800;color:#e2e8f0}
.pred-conf span{font-size:13px;font-weight:400;color:#64748b}
.conf-bar{width:100%;background:#1e2d4a;border-radius:10px;height:10px;overflow:hidden}
.conf-fill{height:100%;border-radius:10px;transition:width .7s cubic-bezier(.4,0,.2,1)}
.conf-fill.buy{background:linear-gradient(90deg,#10b981,#34d399)}
.conf-fill.sell{background:linear-gradient(90deg,#ef4444,#f87171)}
.conf-fill.hold{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.pred-desc{font-size:12px;color:#64748b;text-align:center;line-height:1.7;max-width:280px}

/* SIGNALS */
.signal-list{display:flex;flex-direction:column;gap:9px}
.sig-row{display:flex;align-items:flex-start;gap:8px}
.sig-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:3px}
.sig-dot.bullish{background:#10b981}
.sig-dot.bearish{background:#ef4444}
.sig-dot.neutral{background:#64748b}
.sig-txt{font-size:12px;line-height:1.5}
.sig-txt.bullish{color:#34d399}
.sig-txt.bearish{color:#f87171}
.sig-txt.neutral{color:#94a3b8}

/* CHART */
.chart-card{background:#12192c;border:1.5px solid #1e2d4a;border-radius:16px;padding:20px;margin-bottom:16px}
.chart-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.chart-title{font-size:14px;font-weight:700;color:#e2e8f0}
.range-row{display:flex;gap:5px}
.rbtn{background:none;border:1.5px solid #1e2d4a;color:#64748b;padding:5px 12px;border-radius:7px;font-size:12px;font-weight:700;transition:all .15s}
.rbtn:hover{border-color:#3b82f6;color:#60a5fa}
.rbtn.active{background:#3b82f6;border-color:#3b82f6;color:#fff}
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.leg{display:flex;align-items:center;gap:5px;font-size:11px;color:#64748b}
.leg-line{width:18px;height:2px;border-radius:1px}
.chart-wrap{position:relative;height:300px}

/* TECHNICALS GRID */
.tech-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;margin-bottom:16px}
.tech-card{background:#12192c;border:1.5px solid #1e2d4a;border-radius:12px;padding:16px}
.tech-lbl{font-size:11px;color:#64748b;letter-spacing:.05em;margin-bottom:6px;font-weight:600}
.tech-val{font-size:22px;font-weight:800;color:#e2e8f0}
.tech-sub{font-size:11px;color:#64748b;margin-top:3px}
.tbadge{display:inline-block;padding:3px 8px;border-radius:5px;font-size:11px;font-weight:700;margin-top:5px}
.tbadge.bull{background:#064e3b;color:#10b981}
.tbadge.bear{background:#7f1d1d;color:#ef4444}
.tbadge.neu{background:#1e2d4a;color:#64748b}

/* STATS GRID */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.stat-card{background:#12192c;border:1.5px solid #1e2d4a;border-radius:12px;padding:16px}
.stat-lbl{font-size:11px;color:#64748b;margin-bottom:5px;font-weight:600;letter-spacing:.04em}
.stat-val{font-size:17px;font-weight:800;color:#e2e8f0}

/* ERROR */
.error-wrap{text-align:center;padding:60px 20px}
.err-icon{font-size:52px;margin-bottom:16px}
.err-title{font-size:22px;font-weight:800;color:#ef4444;margin-bottom:8px}
.err-msg{font-size:14px;color:#64748b;max-width:420px;margin:0 auto 28px;line-height:1.7}
.retry-btn{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;border:none;border-radius:10px;padding:12px 30px;font-size:14px;font-weight:700}
.retry-btn:hover{opacity:.85}

/* DISCLAIMER */
.disclaimer{padding:14px 16px;background:#0d1630;border:1.5px solid #1e2d4a;border-radius:10px;font-size:11px;color:#475569;line-height:1.7}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="header-inner">
      <div class="logo" onclick="showHome()">
        <span class="logo-icon">📈</span>
        <div>
          <div class="logo-title">AI株価予測</div>
          <div class="logo-sub">米国株・ETFアナライザー</div>
        </div>
      </div>
      <div class="search-wrap">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" placeholder="ティッカー・銘柄名 (例: AAPL, NVDA, SPY)" autocomplete="off" spellcheck="false">
          <button id="searchBtn">分析する</button>
        </div>
        <div id="autocomplete" class="autocomplete"></div>
      </div>
    </div>
  </header>
  <main id="main"></main>
</div>

<script>
// =========================================================
// CONSTANTS
// =========================================================

const STOCKS = {
  // Technology
  'AAPL':  {name:'Apple Inc.',type:'株式'},
  'MSFT':  {name:'Microsoft Corporation',type:'株式'},
  'GOOGL': {name:'Alphabet Inc. (Google)',type:'株式'},

  'NFLX':  {name:'Netflix Inc.',type:'株式'},

  // Finance
  'JPM':   {name:'JPMorgan Chase & Co.',type:'株式'},
  'BAC':   {name:'Bank of America',type:'株式'},
  'GS':    {name:'Goldman Sachs',type:'株式'},
  'MS':    {name:'Morgan Stanley',type:'株式'},
  'V':     {name:'Visa Inc.',type:'株式'},
  'MA':    {name:'Mastercard Inc.',type:'株式'},
  // Healthcare
  'JNJ':   {name:'Johnson & Johnson',type:'株式'},
  'UNH':   {name:'UnitedHealth Group',type:'株式'},
  'PFE':   {name:'Pfizer Inc.',type:'株式'},
  'ABBV':  {name:'AbbVie Inc.',type:'株式'},
  // Consumer
  'WMT':   {name:'Walmart Inc.',type:'株式'},
  'PG':    {name:'Procter & Gamble',type:'株式'},
  'KO':    {name:'Coca-Cola Company',type:'株式'},
  'HD':    {name:'Home Depot',type:'株式'},
  'DIS':   {name:'Walt Disney Co.',type:'株式'},
  'MCD':   {name:"McDonald's Corporation",type:'株式'},
  'NKE':   {name:'Nike Inc.',type:'株式'},
  // Energy
  'XOM':   {name:'Exxon Mobil Corporation',type:'株式'},
  'CVX':   {name:'Chevron Corporation',type:'株式'},
  // ETFs
  'SPY':   {name:'SPDR S&P 500 ETF',type:'ETF'},
  'QQQ':   {name:'Invesco QQQ Trust (NASDAQ 100)',type:'ETF'},
  'VOO':   {name:'Vanguard S&P 500 ETF',type:'ETF'},
  'IVV':   {name:'iShares Core S&P 500 ETF',type:'ETF'},
  'VTI':   {name:'Vanguard Total Stock Market ETF',type:'ETF'},
  'VGT':   {name:'Vanguard Information Technology ETF',type:'ETF'},
  'ARKK':  {name:'ARK Innovation ETF',type:'ETF'},
  'GLD':   {name:'SPDR Gold Shares',type:'ETF'},
  'TLT':   {name:'iShares 20+ Year Treasury Bond ETF',type:'ETF'},
  'SOXX':  {name:'iShares Semiconductor ETF',type:'ETF'},
  'XLK':   {name:'Technology Select Sector SPDR Fund',type:'ETF'},
  'XLF':   {name:'Financial Select Sector SPDR Fund',type:'ETF'},
  'SOXL':  {name:'Direxion Semiconductor Bull 3X ETF',type:'ETF'},
  'TQQQ':  {name:'ProShares UltraPro QQQ (3x)',type:'ETF'},
};

const FEATURED = ['AAPL','NVDA','MSFT','TSLA','GOOGL','META','AMZN','AMD','SPY','QQQ','VOO','SOXX'];

const RANGE_DAYS = {'1M':21,'3M':63,'6M':126,'1Y':252,'2Y':504,'5Y':1300};

// =========================================================
// STATE
// =========================================================

const state = {view:'home', symbol:null, data:null, prediction:null, range:'1Y', chart:null};

// =========================================================
// TECHNICAL ANALYSIS
// =========================================================

function sma(prices, p) {
  const r = new Array(prices.length).fill(null);
  for (let i = p-1; i < prices.length; i++) {
    let s = 0; for (let j=i-p+1;j<=i;j++) s+=prices[j];
    r[i] = s/p;
  }
  return r;
}

function ema(prices, p) {
  const r = new Array(prices.length).fill(null);
  const k = 2/(p+1);
  let s=0; for(let i=0;i<p;i++) s+=prices[i];
  r[p-1]=s/p;
  for(let i=p;i<prices.length;i++) r[i]=prices[i]*k+r[i-1]*(1-k);
  return r;
}

function rsi(prices, p=14) {
  const r = new Array(prices.length).fill(null);
  for(let i=p;i<prices.length;i++){
    let g=0,l=0;
    for(let j=i-p+1;j<=i;j++){
      const d=prices[j]-prices[j-1];
      if(d>0) g+=d; else l-=d;
    }
    const ag=g/p, al=l/p;
    r[i] = al===0 ? 100 : 100-100/(1+ag/al);
  }
  return r;
}

function macd(prices) {
  const e12=ema(prices,12), e26=ema(prices,26);
  const ml=prices.map((_,i)=>e12[i]!=null&&e26[i]!=null?e12[i]-e26[i]:null);
  const sl=new Array(prices.length).fill(null);
  const vs=ml.findIndex(v=>v!=null);
  if(vs>=0&&vs+9<=prices.length){
    const k=2/10;
    let prev=ml.slice(vs,vs+9).reduce((a,b)=>a+b,0)/9;
    sl[vs+8]=prev;
    for(let i=vs+9;i<prices.length;i++){
      if(ml[i]!=null){prev=ml[i]*k+prev*(1-k);sl[i]=prev;}
    }
  }
  const hl=prices.map((_,i)=>ml[i]!=null&&sl[i]!=null?ml[i]-sl[i]:null);
  return {ml,sl,hl};
}

function bb(prices, p=20, m=2) {
  const mid=sma(prices,p);
  const u=new Array(prices.length).fill(null);
  const l=new Array(prices.length).fill(null);
  for(let i=p-1;i<prices.length;i++){
    const sl=prices.slice(i-p+1,i+1);
    const std=Math.sqrt(sl.reduce((s,v)=>s+Math.pow(v-mid[i],2),0)/p);
    u[i]=mid[i]+m*std; l[i]=mid[i]-m*std;
  }
  return {u,mid,l};
}

function predict(data) {
  const {closes, volumes} = data;
  const n = closes.length;
  if(n < 60) return {signal:'HOLD',confidence:50,score:50,signals:{},tech:{}};

  const s20=sma(closes,20), s50=sma(closes,50);
  const s200=n>=200?sma(closes,200):null;
  const r14=rsi(closes,14);
  const m=macd(closes);
  const b=bb(closes,20);
  const last=n-1;
  const px=closes[last];
  let score=0;
  const signals={};

  // --- SMA 20 ---
  if(s20[last]!=null){
    if(px>s20[last]){score+=1.5;signals.sma20={s:'bullish',t:`価格 > SMA20 ($${s20[last].toFixed(2)}) — 短期上昇トレンド`};}
    else{score-=1.5;signals.sma20={s:'bearish',t:`価格 < SMA20 ($${s20[last].toFixed(2)}) — 短期下降トレンド`};}
  }
  // --- SMA 50 ---
  if(s50[last]!=null){
    if(px>s50[last]){score+=1.5;signals.sma50={s:'bullish',t:`価格 > SMA50 ($${s50[last].toFixed(2)}) — 中期上昇トレンド`};}
    else{score-=1.5;signals.sma50={s:'bearish',t:`価格 < SMA50 ($${s50[last].toFixed(2)}) — 中期下降トレンド`};}
  }
  // --- SMA 200 ---
  if(s200&&s200[last]!=null){
    if(px>s200[last]){score+=2;signals.sma200={s:'bullish',t:`価格 > SMA200 ($${s200[last].toFixed(2)}) — 長期強気トレンド`};}
    else{score-=2;signals.sma200={s:'bearish',t:`価格 < SMA200 ($${s200[last].toFixed(2)}) — 長期弱気トレンド`};}
  }
  // --- Golden/Death Cross ---
  if(s20[last]!=null&&s50[last]!=null){
    if(s20[last]>s50[last]){score+=1;signals.cross={s:'bullish',t:'ゴールデンクロス: SMA20 > SMA50 (上昇シグナル)'};}
    else{score-=1;signals.cross={s:'bearish',t:'デスクロス: SMA20 < SMA50 (下降シグナル)'};}
  }
  // --- RSI ---
  const rv=r14[last];
  if(rv!=null){
    if(rv<30){score+=2.5;signals.rsi={s:'bullish',t:`RSI ${rv.toFixed(1)} — 売られすぎ圏 (強い反発シグナル)`};}
    else if(rv<40){score+=1;signals.rsi={s:'bullish',t:`RSI ${rv.toFixed(1)} — 弱気だが反発余地あり`};}
    else if(rv>80){score-=3;signals.rsi={s:'bearish',t:`RSI ${rv.toFixed(1)} — 極度の買われすぎ (調整リスク大)`};}
    else if(rv>70){score-=2;signals.rsi={s:'bearish',t:`RSI ${rv.toFixed(1)} — 買われすぎ圏 (調整に注意)`};}
    else if(rv>=55){score+=1;signals.rsi={s:'bullish',t:`RSI ${rv.toFixed(1)} — 強気ゾーン (モメンタム良好)`};}
    else{signals.rsi={s:'neutral',t:`RSI ${rv.toFixed(1)} — 中立ゾーン`};}
  }
  // --- MACD ---
  const mv=m.ml[last],msv=m.sl[last],mhv=m.hl[last];
  if(mv!=null&&msv!=null){
    if(mv>msv){score+=1.5;signals.macd={s:'bullish',t:`MACD(${mv.toFixed(2)}) > シグナル(${msv.toFixed(2)}) — 上昇モメンタム`};}
    else{score-=1.5;signals.macd={s:'bearish',t:`MACD(${mv.toFixed(2)}) < シグナル(${msv.toFixed(2)}) — 下降モメンタム`};}
    if(mhv!=null&&last>0){
      const ph=m.hl[last-1];
      if(ph!=null){
        if(mhv>ph&&mhv>0){score+=0.5;signals.macdTrend={s:'bullish',t:'MACDヒストグラム拡大 (上昇加速中)'};}
        else if(mhv<ph&&mhv<0){score-=0.5;signals.macdTrend={s:'bearish',t:'MACDヒストグラム拡大 (下降加速中)'};}
      }
    }
  }
  // --- Bollinger Bands ---
  if(b.u[last]!=null&&b.l[last]!=null){
    const range=b.u[last]-b.l[last];
    const pos=range>0?(px-b.l[last])/range:0.5;
    if(pos>1.05){score-=2;signals.bb={s:'bearish',t:`バンド上抜け — 過熱感 (短期調整リスク高)`};}
    else if(pos<-0.05){score+=2;signals.bb={s:'bullish',t:`バンド下抜け — 売られすぎ (反発期待高)`};}
    else if(pos>=0.8){score+=0.5;signals.bb={s:'bullish',t:`バンド上部 ${Math.round(pos*100)}% — 強い上昇力`};}
    else if(pos<=0.2){score-=0.5;signals.bb={s:'bearish',t:`バンド下部 ${Math.round(pos*100)}% — 弱含み`};}
    else{signals.bb={s:'neutral',t:`バンド中央付近 ${Math.round(pos*100)}% — 中立`};}
  }
  // --- Volume ---
  if(volumes&&volumes.length>=10){
    const rv5=volumes.slice(-5).reduce((a,b)=>a+b,0)/5;
    const pv5=volumes.slice(-10,-5).reduce((a,b)=>a+b,0)/5;
    if(rv5>pv5*1.2){score+=0.8;signals.vol={s:'bullish',t:`出来高急増 (直近${(rv5/1e6).toFixed(1)}M vs 前${(pv5/1e6).toFixed(1)}M) — 強い関心`};}
    else if(rv5<pv5*0.8){score-=0.5;signals.vol={s:'bearish',t:'出来高急減 — 買い勢力の後退'};}
    else{signals.vol={s:'neutral',t:'出来高は平常レベル'};}
  }
  // --- 5-day Momentum ---
  if(n>5){
    const mom5=((closes[last]-closes[last-5])/closes[last-5])*100;
    if(mom5>5){score+=1;signals.mom={s:'bullish',t:`5日騰落率 +${mom5.toFixed(1)}% — 強いモメンタム`};}
    else if(mom5<-5){score-=1;signals.mom={s:'bearish',t:`5日騰落率 ${mom5.toFixed(1)}% — 強い下落`};}
  }
  // --- 20-day Price Trend ---
  if(n>20&&s20[last]!=null&&s20[last-10]!=null){
    const smaSlope=(s20[last]-s20[last-10])/s20[last-10]*100;
    if(smaSlope>1){score+=0.5;signals.trend={s:'bullish',t:`SMA20上向き (+${smaSlope.toFixed(1)}%) — 上昇トレンド継続`};}
    else if(smaSlope<-1){score-=0.5;signals.trend={s:'bearish',t:`SMA20下向き (${smaSlope.toFixed(1)}%) — 下降トレンド継続`};}
  }

  // Normalize [-12, +12] → [0, 100]
  const norm=Math.max(0,Math.min(100,(score+12)/24*100));
  let signal,confidence;
  if(norm>=62){
    signal='BUY';
    confidence=Math.min(92,Math.round(55+(norm-62)*1.4));
  } else if(norm<=38){
    signal='SELL';
    confidence=Math.min(92,Math.round(55+(38-norm)*1.4));
  } else {
    signal='HOLD';
    confidence=Math.round(48+Math.abs(norm-50)*0.6);
  }

  return {
    signal, confidence,
    score:norm, rawScore:score,
    signals,
    tech:{
      sma20:s20[last], sma50:s50[last],
      sma200:s200?s200[last]:null,
      rsi:rv, macd:mv, macdSig:msv,
      bbU:b.u[last], bbMid:b.mid[last], bbL:b.l[last],
    },
    chartArrays:{s20,s50,s200,bbU:b.u,bbL:b.l}
  };
}

// DATA FETCHING

async function fetchData(symbol) {
  const base = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}?interval=1d&range=5y&includePrePost=false`;
  const proxies = [
    `https://corsproxy.io/?${encodeURIComponent(base)}`,
    `https://api.allorigins.win/raw?url=${encodeURIComponent(base)}`,
    base,
  ];

  let lastErr;
  for(const url of proxies){
    try{
      const ac=new AbortController();
      const tid=setTimeout(()=>ac.abort(),14000);
      const res=await fetch(url,{signal:ac.signal,headers:{'Accept':'application/json'}});
      clearTimeout(tid);
      if(!res.ok) continue;
      const json=await res.json();
      if(!json?.chart?.result?.[0]) throw new Error(json?.chart?.error?.description||'銘柄データが見つかりません');
      return parseYahoo(json,symbol);
    } catch(e){ lastErr=e; }
  }
  throw lastErr||new Error('データ取得に失敗しました');
}

function parseYahoo(json,symbol){
  const result=json.chart.result[0];
  const meta=result.meta;
  const ts=result.timestamp||[];
  const q=result.indicators.quote[0];
  const adj=result.indicators.adjclose?.[0]?.adjclose||q.close;

  const dates=[],closes=[],opens=[],highs=[],lows=[],volumes=[];
  for(let i=0;i<ts.length;i++){
    if(adj[i]==null||isNaN(adj[i])) continue;
    const d=new Date(ts[i]*1000);
    const mo=String(d.getMonth()+1).padStart(2,'0');
    const dy=String(d.getDate()).padStart(2,'0');
    dates.push(`${d.getFullYear()}/${mo}/${dy}`);
    closes.push(adj[i]);
    opens.push(q.open[i]??adj[i]);
    highs.push(q.high[i]??adj[i]);
    lows.push(q.low[i]??adj[i]);
    volumes.push(q.volume[i]||0);
  }

  const last=closes.length-1;
  const change=closes[last]-(closes[last-1]??closes[last]);
  const changePct=closes[last-1]?change/closes[last-1]*100:0;
  const y252=closes.slice(-252);

  return {
    symbol: meta.symbol||symbol.toUpperCase(),
    name: STOCKS[symbol.toUpperCase()]?.name||meta.longName||meta.shortName||symbol.toUpperCase(),
    exchange: meta.exchangeName||'',
    currency: meta.currency||'USD',
    currentPrice: closes[last],
    change, changePct,
    high52: Math.max(...y252),
    low52: Math.min(...y252),
    dates, closes, opens, highs, lows, volumes,
  };
}

async function doSearch(sym){

  if(!sym) return;
  document.getElementById('searchInput').value=sym;
  document.getElementById('autocomplete').classList.remove('show');
  state.view='loading';
  state.symbol=sym;
  state.range=state.range||'1Y';

  document.getElementById('main').innerHTML=`

      <div class="spinner"></div>
      <div class="loading-text"><span class="loading-sym">${sym}</span> のデータを取得・分析中...</div>
    </div>
  `;

  try{
    const data=await fetchData(sym);
    const pred=predict(data);
    state.data=data;
    state.prediction=pred;
    state.view='result';
    renderResult(data,pred);
  } catch(e){
    console.error(e);

      <span class="ac-type ${i.type==='ETF'?'etf':'stock'}">${i.type}</span>
    </div>
  `).join('');
  ac.classList.add('show');
}

// =========================================================
// INIT
// =========================================================

document.addEventListener('DOMContentLoaded',()=>{
  renderHome();
  const inp=document.getElementById('searchInput');
  const btn=document.getElementById('searchBtn');
  inp.addEventListener('input',e=>updateAC(e.target.value));
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter') doSearch(inp.value);
    if(e.key==='Escape') document.getElementById('autocomplete').classList.remove('show');
  });
  btn.addEventListener('click',()=>doSearch(inp.value));
  document.addEventListener('click',e=>{
    if(!e.target.closest('.search-wrap')) document.getElementById('autocomplete').classList.remove('show');
  });
});
</script>
</body>
</html>
