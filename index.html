function fmtDT(dt){

  var d=new Date(dt);if(isNaN(d))return dt;

  var p=function(n){return String(n).padStart(2,'0');};

}

async function sbReq(method,table,body,id,q){
  var url=SB+'/rest/v1/'+table+(id?'?id=eq.'+id:(q||''));
  var h={'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Accept':'application/json'};
  if(method==='POST')h['Prefer']='return=representation';
  var r=await fetch(url,{method:method,headers:h,body:body?JSON.stringify(body):null});
  if(!r.ok)throw new Error(await r.text());
  var t=await r.text();return t?JSON.parse(t):[];
}

async function submitOrder(){

function renderCal(){
  var DAYS=LANG==='ko'?['\uc77c','\uc6d4','\ud654','\uc218','\ubaa9','\uae08','\ud1a0']:['\u65e5','\u6708','\u706b','\u6c34','\u6728','\u91d1','\u571f'];
  var MONTHS=LANG==='ko'?['1\uc6d4','2\uc6d4','3\uc6d4','4\uc6d4','5\uc6d4','6\uc6d4','7\uc6d4','8\uc6d4','9\uc6d4','10\uc6d4','11\uc6d4','12\uc6d4']:['\uff11\u6708','\uff12\u6708','\uff13\u6708','\uff14\u6708','\uff15\u6708','\uff16\u6708','\uff17\u6708','\uff18\u6708','\uff19\u6708','10\u6708','11\u6708','12\u6708'];
  var fd=new Date(calY,calM,1).getDay(),dim=new Date(calY,calM+1,0).getDate();
  var tod=new Date().toISOString().slice(0,10);
  var byDate={};DB.orders.forEach(function(o){var dk=(o.pickup||'').slice(0,10);if(!byDate[dk])byDate[dk]=[];byDate[dk].push(o);});
  var mc=document.getElementById('mc');

  var grid=document.getElementById('cgrid');
  DAYS.forEach(function(d,i){var el=document.createElement('div');el.className='cal-dh';el.style.color=i===0?'#e05555':i===6?'#1565a8':'#666';el.textContent=d;grid.appendChild(el);});
  for(var i=0;i<fd;i++){var e=document.createElement('div');e.className='cal-empty';grid.appendChild(e);}
  for(var d=1;d<=dim;d++){
    (function(d){
      var ds=calY+'-'+String(calM+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      var hol=HOLIDAYS[ds]||'',lun=LUNAR_F[ds]||'';
      var orders=byDate[ds]||[],isT=ds===tod,isSun=(fd+d-1)%7===0,isSat=(fd+d-1)%7===6,isSel=calSel===ds;
      var lunar=getLunar(ds);
      var el=document.createElement('div');
      el.className='cal-cell';
      el.style.background=isSel?'#fff3e0':isT?'#e8f5e9':'#fff';
      el.style.border=isT?'2px solid #2e7d5a':isSel?'2px solid #c8832a':'1px solid #e8d4b8';
      var html='<div class="cal-date" style="color:'+(hol?'#e05555':isSun?'#e05555':isSat?'#1565a8':'#2a1208')+';font-weight:'+(isT?700:500)+'">'+d+(isT?'<span style="font-size:7px;background:#2e7d5a;color:#fff;border-radius:2px;padding:0 2px;margin-left:2px">'+sl('\uc624\ub298','\u4eca\u65e5')+'</span>':'')+'</div><div class="lunar">'+sl('\uc74c','\u9670')+' '+lunar.m+'/'+lunar.d+'</div>'+(hol?'<div class="hol-tag">'+hol+'</div>':'')+(lun&&!hol?'<div class="lun-tag">'+lun+'</div>':'');
      orders.slice(0,2).forEach(function(o){var c=SM[o.status]?SM[o.status].color:'#888';html+='<div class="cal-dot" style="background:'+c+'22;color:'+c+'">'+o.customer_name+'</div>';});
      if(orders.length>2)html+='<div style="font-size:7px;color:#888">+'+(orders.length-2)+sl('\uac74','\u4ef6')+'</div>';
      el.innerHTML=html;
      el.onclick=function(){calSel=calSel===ds?null:ds;renderCal();};
      grid.appendChild(el);
    })(d);
  }
  if(calSel&&byDate[calSel]){
    var det=document.getElementById('cdet');
    det.innerHTML='<div class="cal-detail"><div class="card-title">'+calSel+' '+sl('\uc8fc\ubb38 \ubaa9\ub85d','\u6ce8\u6587\u4e00\u89a7')+'</div>'+byDate[calSel].map(function(o){return '<div class="cdrow">'+mn(o.id)+'<span>'+o.customer_name+'</span><span>'+(o.items||[]).map(function(it){return it.name+'\xd7'+it.qty;}).join(', ')+'</span>'+badge(o.status)+'<strong style="color:#c8832a">\u20a9'+o.total.toLocaleString()+'</strong><button class="prt-b" onclick="printR(\''+o.id+'\')">&#128424;</button></div>';}).join('')+'</div>';
  }
}

// CUSTOMERS - Naver Map & SMS
function openNaverMap(addr){if(!addr){toast(sl('\uc8fc\uc18c\uac00 \uc5c6\uc2b5\ub2c8\ub2e4','\u4f4f\u6240\u304c\u3042\u308a\u307e\u305b\u3093'));return;}window.open('https://map.naver.com/v5/search/'+encodeURIComponent(addr),'_blank');}
function openSMS(phone,msg){if(!phone){toast(sl('\uc804\ud654\ubc88\ud638\uac00 \uc5c6\uc2b5\ub2c8\ub2e4','\u96fb\u8a71\u756a\u53f7\u304c\u3042\u308a\u307e\u305b\u3093'));return;}var clean=phone.replace(/[^0-9]/g,'');window.open('sms:'+clean+(msg?'?body='+encodeURIComponent(msg):''),'_blank');}
function buildPayMsg(cust){
  var b=getBankInfo();
  var orders=DB.orders.filter(function(o){return o.customer_name===cust.name&&!o.paid;});
  var bankLine=b.bank?(b.bank+' '+b.account+' ('+b.holder+')'):'';
  var nl='\n';
  var msg='';
  if(!orders.length){
    if(LANG==='ko'){msg='\ud574\uc6b8\ub5a1\uc785\ub2c8\ub2e4'+nl+nl+(bankLine?'\ud83c\udfe6 '+bankLine+nl+nl:'')+'\uc785\uae08 \ubd80\ud0c1\ub4dc\ub9bd\ub2c8\ub2e4.'+nl+'\uac10\uc0ac\ud569\ub2c8\ub2e4';}
    else{msg='\u30d8\u30a6\u30eb\u30c8\u30c3\u30af\u3067\u3054\u3056\u3044\u307e\u3059'+nl+nl+(bankLine?'\ud83c\udfe6 '+bankLine+nl+nl:'')+'\u304a\u632f\u8fbc\u3092\u304a\u9858\u3044\u3044\u305f\u3057\u307e\u3059\u3002'+nl+'\u3088\u308d\u3057\u304f\u304a\u9858\u3044\u3044\u305f\u3057\u307e\u3059';}
    return msg;
  }
  var o=orders[0];
  var d=new Date(o.pickup);
  var days=['\uc77c','\uc6d4','\ud654','\uc218','\ubaa9','\uae08','\ud1a0'];
  var dateStr=(o.pickup||'').slice(0,10)+' ('+days[d.getDay()]+')';
  var items=(o.items||[]).map(function(it){return it.name+' x'+it.qty+(LANG==='ko'?'\uac1c':'\u500b');}).join(', ');
  if(LANG==='ko'){
    msg='\ud574\uc6b8\ub5a1\uc785\ub2c8\ub2e4'+nl;
    msg+=nl+'\uc8fc\ubb38\ud574 \uc8fc\uc154\uc11c \uac10\uc0ac\ud569\ub2c8\ub2e4.'+nl;
    msg+=nl+'[\uc8fc\ubb38 \ub0b4\uc5ed]'+nl+items+nl;
    msg+='\ud569\uacc4: \u20a9'+o.total.toLocaleString()+nl;
    msg+=nl+'\uc218\ub839\uc77c: '+dateStr+nl;
    if(bankLine)msg+=nl+'\ud83c\udfe6 '+bankLine+nl;
    msg+=nl+dateStr+' \uc218\ub839\uc77c\uae4c\uc9c0 \uc785\uae08 \ubd80\ud0c1\ub4dc\ub9bd\ub2c8\ub2e4.'+nl;
    msg+='\uac10\uc0ac\ud569\ub2c8\ub2e4';
  } else {
    msg='\u30d8\u30a6\u30eb\u30c8\u30c3\u30af\u3067\u3054\u3056\u3044\u307e\u3059'+nl;
    msg+=nl+'\u3054\u6ce8\u6587\u3042\u308a\u304c\u3068\u3046\u3054\u3056\u3044\u307e\u3059\u3002'+nl;
    msg+=nl+'[\u3054\u6ce8\u6587\u5185\u5bb9]'+nl+items+nl;
    msg+='\u5408\u8a08: \u20a9'+o.total.toLocaleString()+nl;
    msg+=nl+'\u53d7\u53d6\u65e5: '+dateStr+nl;
    if(bankLine)msg+=nl+'\ud83c\udfe6 '+bankLine+nl;
    msg+=nl+'\u53d7\u53d6\u65e5\u307e\u3067\u306b\u304a\u632f\u8fbc\u3092\u304a\u9858\u3044\u3044\u305f\u3057\u307e\u3059\u3002'+nl;
    msg+='\u3088\u308d\u3057\u304f\u304a\u9858\u3044\u3044\u305f\u3057\u307e\u3059';
  }
  return msg;
}
function openSMSModal(phone,msg){
  var b=getBankInfo();
  var body='<div class="fcol"><div><label class="lbl">'+sl('\uc218\uc2e0\uc790 \uc804\ud654\ubc88\ud638','\u5b9b\u5148\u96fb\u8a71\u756a\u53f7')+'</label><input class="inp" id="sms-phone" value="'+phone+'"/></div><div><label class="lbl">'+sl('\uba54\uc2dc\uc9c0 \ub0b4\uc6a9','\u30e1\u30c3\u30bb\u30fc\u30b8\u5185\u5bb9')+'</label><textarea class="inp" id="sms-body" rows="9" style="resize:vertical">'+msg+'</textarea></div>'+(b.bank?'<div class="bank-box">\ud83c\udfe6 '+sl('\uc740\ud589 \uc815\ubcf4','\u9280\u884c\u60c5\u5831')+': '+b.bank+' '+b.account+' ('+b.holder+')</div>':'')+'</div>';
  om(sl('\uc785\uae08 \uc548\ub0b4 \ubb38\uc790 \uc804\uc1a1','\u632f\u8fbc\u6848\u5185SMS\u9001\u4fe1'),body,'<button class="canbtn" onclick="cm()">'+sl('\ucde8\uc18c','\u30ad\u30e3\u30f3\u30bb\u30eb')+'</button><button class="savbtn" onclick="sendSMSNow()">'+sl('\ubb38\uc790 \uc571 \uc5f4\uae30','SMS\u30a2\u30d7\u30ea\u3092\u958b\u304f')+'</button>');
}
function sendSMSNow(){var phone=(document.getElementById('sms-phone')||{}).value;var msg=(document.getElementById('sms-body')||{}).value;cm();openSMS(phone,msg);}
function custCard(c){
  var el=document.createElement('div');
  el.className='ccard';
  var phoneSection='<div class="cdet">\ud83d\udcde '+c.phone+'</div>';
  var addrSection='<div class="cdet">\ud83d\udccd '+c.address+'</div>';
  el.innerHTML='<div class="avatar">'+c.name[0]+'</div><div style="flex:1"><div class="cname">'+c.name+'</div>'+phoneSection+'<div class="cdet">\u2709\ufe0f '+c.email+'</div>'+addrSection+(c.note?'<div class="cnote">\u2b50 '+c.note+'</div>':'')+'<div class="cstats"><span>'+sl('\uc8fc\ubb38','\u6ce8\u6587')+' <strong>'+c.total_orders+sl('\ud68c','\u56de')+'</strong></span><span>'+sl('\ub204\uc801','\u7d2f\u8a08')+' <strong>\u20a9'+c.total_spent.toLocaleString()+'</strong></span></div>'
    +(c.phone?'<div style="display:flex;gap:4px;margin-top:6px;flex-wrap:wrap"><button class="sms-b" id="sms-btn-'+c.id+'">\ud83d\udcac '+sl('\ubb38\uc790','SMS')+'</button><button class="bank-b" id="bank-btn-'+c.id+'">\ud83c\udfe6 '+sl('\uc785\uae08 \uc548\ub0b4','\u632f\u8fbc\u6848\u5185')+'</button></div>':'')
    +(c.address?'<div style="margin-top:4px"><button class="map-b" id="map-btn-'+c.id+'">\ud83d\uddfa\ufe0f '+sl('\ub124\uc774\ubc84 \uc9c0\ub3c4','\u30ca\u30fc\u30d0\u30fc\u5730\u56f3')+'</button></div>':'')
    +'</div><div style="display:flex;flex-direction:column;gap:4px"><button class="edit-b" id="edit-btn-'+c.id+'">'+sl('\ud3b8\uc9d1','\u7de8\u96c6')+'</button><button class="edit-b" style="background:#e3f2fd;color:#1565a8" id="hist-btn-'+c.id+'">'+sl('\uc8fc\ubb38\uc774\ub825','\u6ce8\u6587\u5c65\u6b74')+'</button><button class="del-b" id="del-btn-'+c.id+'">'+sl('\uc0ad\uc81c','\u524a\u9664')+'</button></div>';
  // イベント設定
  if(c.phone){
    var smsBtn=el.querySelector('#sms-btn-'+c.id);
    if(smsBtn)smsBtn.onclick=function(){openSMS(c.phone,'');};
    var bankBtn=el.querySelector('#bank-btn-'+c.id);
    if(bankBtn)bankBtn.onclick=function(){openSMSModal(c.phone,buildPayMsg(c));};
  }
  if(c.address){
    var mapBtn=el.querySelector('#map-btn-'+c.id);
    if(mapBtn)mapBtn.onclick=function(){openNaverMap(c.address);};
  }
  var editBtn=el.querySelector('#edit-btn-'+c.id);if(editBtn)editBtn.onclick=function(){editCust(c.id);};
  var histBtn=el.querySelector('#hist-btn-'+c.id);if(histBtn)histBtn.onclick=function(){custHist(c.id);};
  var delBtn=el.querySelector('#del-btn-'+c.id);if(delBtn)delBtn.onclick=function(){delCust(c.id);};
  return el;
}
function refreshC(){
  var s=(document.getElementById('cs')||{value:''}).value;
  var el=document.getElementById('clist');if(!el)return;
  el.innerHTML='';
  var f=DB.customers.filter(function(c){return c.name.indexOf(s)>=0||(c.phone&&c.phone.indexOf(s)>=0);});
  if(!f.length){el.innerHTML='<p style="text-align:center;color:#888;padding:30px">'+sl('\uace0\uac1d\uc774 \uc5c6\uc2b5\ub2c8\ub2e4','\u9867\u5ba2\u304c\u3044\u307e\u305b\u3093')+'</p>';return;}
  f.forEach(function(c){el.appendChild(custCard(c));});
}
function renderCust(){
  document.getElementById('mc').innerHTML='<div class="sh"><h2>&#128101; '+sl('\uace0\uac1d \uad00\ub9ac','\u9867\u5ba2\u7ba1\u7406')+'</h2><button class="add-btn" onclick="addCust()">+ '+sl('\uc2e0\uaddc \uace0\uac1d','\u65b0\u898f\u9867\u5ba2')+'</button></div><div class="toolbar"><div class="swrap"><input id="cs" placeholder="'+sl('\uc774\ub984\xb7\uc804\ud654\ubc88\ud638 \uac80\uc0c9...','\u6c0f\u540d\u30fb\u96fb\u8a71\u756a\u53f7\u691c\u7d22...')+'" oninput="refreshC()"/><button class="sclear" onclick="document.getElementById(\'cs\').value=\'\';refreshC()">\xd7</button></div></div><div id="clist" class="cust-grid"></div>';
  refreshC();
}
function custFB(c){return '<div class="fcol"><div><label class="lbl">'+sl('\uc131\uba85','\u6c0f\u540d')+'</label><input class="inp" id="fcn" value="'+(c?c.name||'':'')+'" /></div><div><label class="lbl">'+sl('\uc804\ud654\ubc88\ud638','\u96fb\u8a71\u756a\u53f7')+'</label><input class="inp" id="fcp" value="'+(c?c.phone||'':'')+'" placeholder="010-0000-0000"/></div><div><label class="lbl">'+sl('\uc774\uba54\uc77c','\u30e1\u30fc\u30eb')+'</label><input class="inp" id="fce" value="'+(c?c.email||'':'')+'" /></div><div><label class="lbl">'+sl('\uc8fc\uc18c','\u4f4f\u6240')+'</label><input class="inp" id="fca" value="'+(c?c.address||'':'')+'" /></div><div><label class="lbl">'+sl('\uba54\ubaa8','\u30e1\u30e2')+'</label><input class="inp" id="fcm" value="'+(c?c.note||'':'')+'" /></div></div>';}
function addCust(){om(sl('\uc2e0\uaddc \uace0\uac1d \ub4f1\ub85d','\u65b0\u898f\u9867\u5ba2\u767b\u9332'),custFB(null),'<button class="canbtn" onclick="cm()">'+sl('\ucde8\uc18c','\u30ad\u30e3\u30f3\u30bb\u30eb')+'</button><button class="savbtn" onclick="submitCust()">'+sl('\uc800\uc7a5\ud558\uae30','\u4fdd\u5b58\u3059\u308b')+'</button>');}
async function submitCust(){
  var name=(document.getElementById('fcn')||{}).value.trim();
  if(!name){toast(sl('\uc131\uba85\uc744 \uc785\ub825\ud574\uc8fc\uc138\uc694','\u6c0f\u540d\u3092\u5165\u529b\u3057\u3066\u304f\u3060\u3055\u3044'));return;}
  var nc={id:nid(),name:name,phone:(document.getElementById('fcp')||{}).value,email:(document.getElementById('fce')||{}).value,address:(document.getElementById('fca')||{}).value,note:(document.getElementById('fcm')||{}).value,total_orders:0,total_spent:0};
  try{setStatus('sav');var r=await sbReq('POST','customers',nc);DB.customers.unshift(r[0]||nc);setStatus('saved');cm();refreshC();toast(sl('\u2713 \ub4f1\ub85d\ub418\uc5c8\uc2b5\ub2c8\ub2e4','\u2713 \u767b\u9332\u3057\u307e\u3057\u305f'));}catch(e){toast('\u26a0\ufe0f '+e.message);}
}
function editCust(id){var c=DB.customers.find(function(x){return x.id===id;});if(!c)return;om(sl('\uace0\uac1d \uc815\ubcf4 \uc218\uc815','\u9867\u5ba2\u60c5\u5831\u7de8\u96c6'),custFB(c),'<button class="canbtn" onclick="cm()">'+sl('\ucde8\uc18c','\u30ad\u30e3\u30f3\u30bb\u30eb')+'</button><button class="savbtn" onclick="submitEditCust(\''+id+'\')">'+sl('\uc800\uc7a5\ud558\uae30','\u4fdd\u5b58\u3059\u308b')+'</button>');}
async function submitEditCust(id){
  var upd={name:(document.getElementById('fcn')||{}).value,phone:(document.getElementById('fcp')||{}).value,email:(document.getElementById('fce')||{}).value,address:(document.getElementById('fca')||{}).value,note:(document.getElementById('fcm')||{}).value};
  try{setStatus('sav');await sbReq('PATCH','customers',upd,id);DB.customers=DB.customers.map(function(c){return c.id===id?Object.assign({},c,upd):c;});setStatus('saved');cm();refreshC();toast(sl('\u2713 \uc218\uc815\ub418\uc5c8\uc2b5\ub2c8\ub2e4','\u2713 \u66f4\u65b0\u3057\u307e\u3057\u305f'));}catch(e){toast('\u26a0\ufe0f '+e.message);}
}
async function delCust(id){if(!confirm(sl('\uc0ad\uc81c\ud558\uc2dc\uaca0\uc2b5\ub2c8\uae4c?','\u524a\u9664\u3057\u307e\u3059\u304b\uff1f')))return;try{setStatus('sav');await sbReq('DELETE','customers',null,id);DB.customers=DB.customers.filter(function(c){return c.id!==id;});setStatus('saved');refreshC();toast(sl('\uc0ad\uc81c\ub418\uc5c8\uc2b5\ub2c8\ub2e4','\u524a\u9664\u3057\u307e\u3057\u305f'));}catch(e){toast('\u26a0\ufe0f '+e.message);}}
function custHist(id){
  var cust=DB.customers.find(function(x){return x.id===id;});if(!cust)return;
  var orders=DB.orders.filter(function(o){return o.customer_name===cust.name;}).sort(function(a,b){return b.pickup.localeCompare(a.pickup);});
  var tot=orders.reduce(function(s,o){return s+o.total;},0);
  var body='<div style="display:flex;gap:10px;margin-bottom:12px"><div style="background:#fff8ef;border-radius:8px;padding:10px 14px;text-align:center"><div style="font-size:16px;font-weight:700;color:#c8832a">'+orders.length+sl('\uac74','\u4ef6')+'</div><div style="font-size:11px;color:#888">'+sl('\uc758 \uc8fc\ubb38','\u306e\u6ce8\u6587')+'</div></div><div style="background:#e8f5e9;border-radius:8px;padding:10px 14px;text-align:center"><div style="font-size:16px;font-weight:700;color:#2e7d5a">\u20a9'+tot.toLocaleString()+'</div><div style="font-size:11px;color:#888">'+sl('\ub204\uc801 \uae08\uc561','\u7d2f\u8a08\u91d1\u984d')+'</div></div></div>'
    +(orders.length?orders.map(function(o){return '<div style="border:1px solid #f0ddc8;border-radius:10px;padding:12px;margin-bottom:8px"><div style="display:flex;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:4px">'+badge(o.status)+'<span style="font-size:11px;color:#888">'+fmtDT(o.pickup)+'</span></div><div style="font-size:12px;color:#555;margin-bottom:4px">'+(o.items||[]).map(function(it){return it.name+' \xd7'+it.qty;}).join(' / ')+'</div><div style="display:flex;justify-content:space-between;margin-top:6px"><strong style="color:#c8832a">\u20a9'+o.total.toLocaleString()+'</strong><span style="font-size:11px;font-weight:600;color:'+(o.paid?'#2e7d5a':'#e05555')+'">'+(o.paid?sl('\u2713 \uc644\ub8cc','\u2713 \u6e08'):sl('\ubbf8\uacb0\uc81c','\u672a\u6255\u3044'))+'</span></div></div>';}).join(''):sl('\uc8fc\ubb38 \ub0b4\uc5ed\uc774 \uc5c6\uc2b5\ub2c8\ub2e4','\u6ce8\u6587\u5c65\u6b74\u304c\u3042\u308a\u307e\u305b\u3093'));
  om(sl('\uc8fc\ubb38 \uc774\ub825','\u6ce8\u6587\u5c65\u6b74')+' - '+cust.name,body,'<button class="canbtn" onclick="cm()">'+sl('\ub2eb\uae30','\u9589\u3058\u308b')+'</button>');
}

// PAYMENTS
function renderPay(){
  var total=DB.payments.filter(function(p){return p.status==='\uc644\ub8cc';}).reduce(function(s,p){return s+p.amount;},0);
  var byM={};DB.payments.forEach(function(p){byM[p.method]=(byM[p.method]||0)+p.amount;});
  var unpaid=DB.orders.filter(function(o){return !o.paid;});
  var mc=document.getElementById('mc');
  mc.innerHTML='<div class="sh"><h2>&#128179; '+sl('\uacb0\uc81c \uad00\ub9ac','\u6c7a\u6e08\u7ba1\u7406')+'</h2><button class="add-btn" onclick="addPay()">+ '+sl('\uacb0\uc81c \uc785\ub825','\u6c7a\u6e08\u5165\u529b')+'</button></div><div class="kpi-grid">'+kpiCard('\ud83d\udcb0',sl('\uc785\uae08\uc561 \ud569\uacc4','\u7dcf\u6c7a\u6e08\u984d'),'\u20a9'+total.toLocaleString(),DB.payments.length+sl('\uac74','\u4ef6'),'#2e7d5a')+Object.entries(byM).map(function(e){return kpiCard('\ud83d\udcb3',e[0],'\u20a9'+e[1].toLocaleString(),sl('\uacb0\uc81c \uc218\ub2e8\ubcc4','\u6c7a\u6e08\u624b\u6bb5\u5225'),'#1565a8');}).join('')+'</div><div class="card"><div class="card-title">'+sl('\uacb0\uc81c \ub0b4\uc5ed','\u6c7a\u6e08\u5c65\u6b74')+'</div><table><thead><tr><th>'+sl('\uacb0\uc81cID','\u6c7a\u6e08ID')+'</th><th>'+sl('\uc8fc\ubb38\ubc88\ud638','\u6ce8\u6587\u756a\u53f7')+'</th><th>'+sl('\uae08\uc561','\u91d1\u984d')+'</th><th>'+sl('\uacb0\uc81c \uc218\ub2e8','\u6c7a\u6e08\u624b\u6bb5')+'</th><th>'+sl('\ub0a0\uc9dc','\u65e5\u4ed8')+'</th><th>'+sl('\uc0c1\ud0dc','\u72b6\u614b')+'</th><th></th></tr></thead><tbody id="ptbody"></tbody></table></div>'+(unpaid.length?'<div class="card"><div class="card-title">'+sl('\ubbf8\uacb0\uc81c \uc8fc\ubb38','\u672a\u6255\u3044\u6ce8\u6587')+'</div><div id="ulist"></div></div>':'');
  var tbody=document.getElementById('ptbody');
  if(tbody){DB.payments.forEach(function(p){var tr=document.createElement('tr');tr.className='tr';tr.innerHTML='<td>'+mn(p.id)+'</td><td>'+mn(p.order_id)+'</td><td>\u20a9'+p.amount.toLocaleString()+'</td><td>'+p.method+'</td><td>'+p.date+'</td><td style="color:#2e7d5a;font-weight:600">\u2713 '+p.status+'</td><td></td>';var btn=document.createElement('button');btn.className='del-b';btn.textContent=sl('\uc0ad\uc81c','\u524a\u9664');btn.onclick=function(){delPay(p.id);};tr.lastChild.appendChild(btn);tbody.appendChild(tr);});}
  var ulist=document.getElementById('ulist');
  if(ulist){unpaid.forEach(function(o){var div=document.createElement('div');div.className='urow';div.innerHTML=mn(o.id)+'<span>'+o.customer_name+'</span><span>'+sl('\uc218\ub839','\u53d7\u53d6')+': '+fmtDT(o.pickup)+'</span><strong style="color:#e05555">\u20a9'+o.total.toLocaleString()+'</strong>';var btn=document.createElement('button');btn.className='pay-b';btn.textContent='+ '+sl('\uacb0\uc81c \uc785\ub825','\u6c7a\u6e08\u5165\u529b');btn.onclick=function(){addPayFor(o.id,o.total);};div.appendChild(btn);ulist.appendChild(div);});}
}
function payFB(oid,amt){return '<div class="fcol"><div><label class="lbl">'+sl('\uc8fc\ubb38\ubc88\ud638','\u6ce8\u6587\u756a\u53f7')+'</label><input class="inp" id="poid" value="'+(oid||'')+'"/></div><div><label class="lbl">'+sl('\uae08\uc561 (\u20a9)','\u91d1\u984d (\u20a9)')+'</label><input class="inp" type="number" id="pamt" value="'+(amt||'')+'"/></div><div><label class="lbl">'+sl('\uacb0\uc81c \uc218\ub2e8','\u6c7a\u6e08\u624b\u6bb5')+'</label><select class="inp" id="pmeth">'+METHS().map(function(m){return '<option>'+m+'</option>';}).join('')+'</select></div><div><label class="lbl">'+sl('\ub0a0\uc9dc','\u65e5\u4ed8')+'</label><input class="inp" type="date" id="pdate" value="'+new Date().toISOString().slice(0,10)+'"/></div></div>';}

  if(!f.length){el.innerHTML='<p style="text-align:center;color:#888;padding:30px">'+sl('\uacbd\ube44\uac00 \uc5c6\uc2b5\ub2c8\ub2e4','\u7d4c\u8cbb\u304c\u3042\u308a\u307e\u305b\u3093')+'</p>';return;}
