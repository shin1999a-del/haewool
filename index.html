const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFka2Z3aGtuZXB0bW5kemdyc2ZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzMTA4MzAsImV4cCI6MjA5Mzg4NjgzMH0.sYmgBSGGVMWWxzNo6qa9f2eTM1tfNG1ULrrH3jyRhJA';

async function sb(method,table,body,id,q){
  const url=SB_URL+'/rest/v1/'+table+(id?'?id=eq.'+id:(q||''));
  const h={
    'apikey':SB_KEY,
    'Authorization':'Bearer '+SB_KEY,
    'Content-Type':'application/json',
    'Accept':'application/json'
  };
  if(method==='POST')h['Prefer']='return=representation';
  if(method==='PATCH')h['Prefer']='return=minimal';
  const r=await fetch(url,{method:method,headers:h,body:body?JSON.stringify(body):null});
  if(!r.ok){
    const errText=await r.text();
    throw new Error(errText);
  }
  const t=await r.text();
  return t?JSON.parse(t):[];
}
const api={
  get:(t,q)=>sb('GET',t,null,null,q||''),
  post:(t,b)=>sb('POST',t,b),
  patch:(t,id,b)=>sb('PATCH',t,b,id),
  del:(t,id)=>sb('DELETE',t,null,id)
};

function mn(t){return '<code class="mn">'+t+'</code>';}
function nid(){return (Date.now().toString(36)+Math.random().toString(36).slice(2,5)).toUpperCase();}
function fmtDT(dt){
  if(!dt)return '-';
  const d=new Date(dt);if(isNaN(d))return dt;
  const days=['일','월','화','수','목','금','토'];
  const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' ('+days[d.getDay()]+') '+p(d.getHours())+':'+p(d.getMinutes());
}
function getLunar(ds){
  const d=new Date(ds),ep=new Date(1900,0,31).getTime();
  const days=Math.floor((d.getTime()-ep)/86400000),cy=29.53059;
  return {m:Math.floor((days/cy)%12)+1,d:Math.floor(((days/cy)%1)*cy)+1};
}
function kpiCard(icon,title,val,sub,color){
  return '<div class="kcard" style="border-top:3px solid '+color+'">'
    +'<div class="icon">'+icon+'</div>'

    +'<div class="ttl">'+title+'</div>'
    +'<div style="font-size:10px;color:#bbb;margin-top:2px">'+sub+'</div>'
    +'</div>';
}
function filesHTML(urls){
  if(!urls||!urls.length)return '';
  return '<div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:5px">'
    +urls.map(function(u){
      var ext=(u.split('.').pop()||'').toLowerCase();
      var icon=['jpg','jpeg','png','gif','webp','heic'].indexOf(ext)>=0?'🖼':ext==='pdf'?'📄':'📎';
      var name=decodeURIComponent(u.split('/').pop()).slice(14)||'파일';
      return '<a href="'+u+'" target="_blank" style="display:inline-flex;align-items:center;gap:3px;padding:3px 8px;background:#f5ede2;border-radius:6px;font-size:11px;color:#333;text-decoration:none">'+icon+' '+name+'</a>';
    }).join('')
    +'</div>';
}
async function uploadFile(file){

    method:'POST',

async function submitOrder(){
  syncItems();
  var name=document.getElementById('fn').value.trim();
  var pickup=document.getElementById('fpk').value;
  var note=document.getElementById('fnote').value.trim();
  var payMethod=document.getElementById('fpay')?document.getElementById('fpay').value:'';
  var phone=document.getElementById('fph')?document.getElementById('fph').value:'';
  var delType=document.getElementById('fdel')?document.getElementById('fdel').value:'방문수령';
  var delAddr=document.getElementById('faddr')?document.getElementById('faddr').value.trim():'';
  if(!name||!pickup){toast(sl('고객명과 수령일을 입력해주세요','顧客名と受取日を入力してください'));return;}
  var total=tmpItems.reduce(function(s,i){return s+i.qty*i.price;},0);
  var fileUrls=[];
  var fi=document.getElementById('ffiles');
  if(fi&&fi.files&&fi.files.length){
    toast(sl('파일 업로드 중...','ファイルアップロード中...'),5000);
    for(var j=0;j<fi.files.length;j++){
      try{fileUrls.push(await uploadFile(fi.files[j]));}catch(e){toast('⚠️ 파일 업로드 실패: '+fi.files[j].name);}
    }
  }
  var newO={id:nid(),customer_name:name,items:tmpItems,total:total,pickup:pickup,status:'pending',paid:false,note:note,delivery_type:delType,delivery_addr:delAddr,file_urls:fileUrls};
  try{
    setStatus('sav');
    var res=await api.post('orders',newO);
    DB.orders.unshift(res[0]||newO);
    var exist=DB.customers.find(function(c){return c.name===name;});
    if(!exist&&name){
      var nc={id:nid(),name:name,phone:phone,email:'',address:'',note:'',total_orders:1,total_spent:total};
      try{var cr=await api.post('customers',nc);DB.customers.unshift(cr[0]||nc);}catch(e){}
    } else if(exist){
      var upd={total_orders:(exist.total_orders||0)+1,total_spent:(exist.total_spent||0)+total};
      try{await api.patch('customers',exist.id,upd);DB.customers=DB.customers.map(function(c){return c.id===exist.id?Object.assign({},c,upd):c;});}catch(e){}
    }
    if(payMethod){
      var np={id:nid(),order_id:(res[0]||newO).id,amount:total,method:payMethod,date:new Date().toISOString().slice(0,10),status:'완료'};
      try{var pr=await api.post('payments',np);DB.payments.unshift(pr[0]||np);await api.patch('orders',(res[0]||newO).id,{paid:true});DB.orders=DB.orders.map(function(o){return o.id===(res[0]||newO).id?Object.assign({},o,{paid:true}):o;});}catch(e){}
    }
    setStatus('saved');cm();refreshOList();updateHdr();
    toast(sl('✓ 주문이 등록되었습니다','✓ 注文を登録しました'));
    await sendKakao(sl('신규 주문 접수','新規注文受付')+'\n'+sl('고객','顧客')+': '+name+'\n'+sl('수령일','受取日')+': '+pickup+'\n'+sl('합계','合計')+': ₩'+total.toLocaleString()+(payMethod?'\n'+sl('결제','決済')+': '+payMethod:''));
  }catch(e){toast('⚠️ '+e.message);}
}

function renderCal(){
  var DAYS=LANG==='ko'?['일','월','화','수','목','금','토']:['日','月','火','水','木','金','土'];
  var MONTHS=LANG==='ko'?['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월']:['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  var fd=new Date(calY,calM,1).getDay(),dim=new Date(calY,calM+1,0).getDate();
  var tod=new Date().toISOString().slice(0,10);
  var byDate={};
  DB.orders.forEach(function(o){var dk=(o.pickup||'').slice(0,10);if(!byDate[dk])byDate[dk]=[];byDate[dk].push(o);});
  var cells='';
  for(var i=0;i<fd;i++)cells+='<div class="cal-empty"></div>';
  for(var d=1;d<=dim;d++){
    var ds=calY+'-'+String(calM+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var hol=HOLIDAYS[ds]||'',lun=LUNAR_F[ds]||'';
    var orders=byDate[ds]||[],isT=ds===tod;
    var isSun=(fd+d-1)%7===0,isSat=(fd+d-1)%7===6,isSel=calSel===ds;
    var lunar=getLunar(ds);
    var dc=hol?'#e05555':isSun?'#e05555':isSat?'#1565a8':'#2a1208';
    var bg=isSel?'#fff3e0':isT?'#e8f5e9':'#fff';
    var bdr=isT?'2px solid #2e7d5a':isSel?'2px solid #c8832a':'1px solid #e8d4b8';
    var todBadge=isT?'<span style="font-size:7px;background:#2e7d5a;color:#fff;border-radius:2px;padding:0 2px;margin-left:2px">'+sl('오늘','今日')+'</span>':'';
    var orderDots=orders.slice(0,2).map(function(o){
      return '<div class="cal-dot" style="background:'+(SM[o.status]?SM[o.status].color:'#888')+'22;color:'+(SM[o.status]?SM[o.status].color:'#888')+'">'+o.customer_name+'</div>';
    }).join('');
    var moreTag=orders.length>2?'<div style="font-size:7px;color:#888">+'+(orders.length-2)+sl('건','件')+'</div>':'';
    // data-ds属性でonclickを安全に実装
    cells+='<div class="cal-cell" style="background:'+bg+';border:'+bdr+'" data-ds="'+ds+'" onclick="cSel(this.getAttribute('data-ds'))">'
      +'<div class="cal-date" style="color:'+dc+';font-weight:'+(isT?700:500)+'">'+d+todBadge+'</div>'
      +'<div class="lunar">'+sl('음','陰')+' '+lunar.m+'/'+lunar.d+'</div>'
      +(hol?'<div class="hol-tag">'+hol+'</div>':'')
      +(lun&&!hol?'<div class="lun-tag">'+lun+'</div>':'')
      +orderDots+moreTag
      +'</div>';
  }
  var selO=calSel?byDate[calSel]||[]:[];
  var selDet=calSel&&selO.length
    ?'<div class="cal-detail"><div style="font-size:15px;font-weight:700;margin-bottom:14px">'+calSel+' '+sl('주문 목록','注文一覧')+'</div>'
      +selO.map(function(o){
        return '<div class="cdrow">'+mn(o.id)+'<span>'+o.customer_name+'</span><span>'+(o.items||[]).map(function(it){return it.name+'×'+it.qty;}).join(', ')+'</span>'+badge(o.status)+'<strong style="color:#c8832a">₩'+o.total.toLocaleString()+'</strong><button class="print-b" onclick="printReceipt(''+o.id+'')">🖨</button></div>';
      }).join('')+'</div>'
    :'';
  var dheads=DAYS.map(function(d,i){return '<div class="cal-dh" style="color:'+(i===0?'#e05555':i===6?'#1565a8':'#666')+'">'+d+'</div>';}).join('');
  document.getElementById('mc').innerHTML=
    '<div class="sec-head"><h2>📅 '+sl('주문 캘린더','注文カレンダー')+'</h2><button class="add-btn" onclick="addOrder()">+ '+sl('신규 주문','新規注文')+'</button></div>'
    +'<div class="lgrow">'
    +'<div class="lgi"><div class="lgd" style="background:#e05555"></div>'+sl('공휴일','祝日')+'</div>'
    +'<div class="lgi"><div class="lgd" style="background:#7b1fa2"></div>'+sl('음력 명절','旧暦節句')+'</div>'
    +'<div class="lgi"><div class="lgd" style="background:#2e7d5a"></div>'+sl('오늘','今日')+'</div>'
    +'</div>'
    +'<div class="cal-wrap">'
    +'<div class="cal-hdr"><button class="cal-nav" onclick="calPrev()">&#8249;</button>'
    +'<span class="cal-title">'+calY+sl('년 ','年')+MONTHS[calM]+'</span>'
    +'<button class="cal-nav" onclick="calNext()">&#8250;</button></div>'
    +'<div class="cal-grid">'+dheads+cells+'</div>'
    +selDet+'</div>';
}
function calPrev(){if(calM===0){calY--;calM=11;}else calM--;calSel=null;renderCal();}

          +'<div style="font-size:12px;color:#555;margin-bottom:4px">'+(o.items||[]).map(function(it){return it.name+' \xd7'+it.qty;}).join(' / ')+'</div>'

async function submitPay(){
  var oid=document.getElementById('poid').value.trim(),amt=Number(document.getElementById('pamt').value);
  if(!oid||!amt){toast(sl('주문번호와 금액을 입력해주세요','注文番号と金額を入力してください'));return;}
  var np={id:nid(),order_id:oid,amount:amt,method:document.getElementById('pmeth').value,date:document.getElementById('pdate').value,status:'완료'};
  try{
    setStatus('sav');var r=await api.post('payments',np);DB.payments.unshift(r[0]||np);
    await api.patch('orders',oid,{paid:true});DB.orders=DB.orders.map(function(o){return o.id===oid?Object.assign({},o,{paid:true}):o;});
    setStatus('saved');cm();renderPay();updateHdr();
    toast(sl('✓ 결제가 등록되었습니다','✓ 決済を登録しました'));
    await sendKakao(sl('결제 완료','支払完了')+'\n'+sl('주문','注文')+': '+oid+'\n'+sl('금액','金額')+': ₩'+amt.toLocaleString());
  }catch(e){toast('⚠️ '+e.message);}
}

}

    +'<button class="edit-b" style="'+(LANG==='ja'?'background:#f5ede2;font-weight:700':'')+'" onclick="if(LANG!==\'ja\')toggleLang()">🇯🇵 日本語</button>'
    +'</div></div>';
}
function saveKakao(){kakaoWH=document.getElementById('kurl').value.trim();localStorage.setItem('hw_kakao',kakaoWH);toast(sl('✓ 저장되었습니다','✓ 保存しました'));renderSet();}
async function testKakao(){var url=document.getElementById('kurl').value.trim();if(!url){toast(sl('URL을 입력해주세요','URLを入力してください'));return;}kakaoWH=url;await sendKakao(sl('테스트 메시지입니다 🍡','テストメッセージです 🍡'));toast(sl('✓ 전송했습니다','✓ 送信しました'));}
function clearKakao(){kakaoWH='';localStorage.removeItem('hw_kakao');toast(sl('삭제되었습니다','削除しました'));renderSet();}
function saveBank(){var b={bank:document.getElementById('bbank').value,account:document.getElementById('bacct').value,holder:document.getElementById('bholder').value};localStorage.setItem('hw_bank',JSON.stringify(b));toast(sl('✓ 저장되었습니다','✓ 保存しました'));}
function exportData(){var a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(DB,null,2));a.download='haewool_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();toast(sl('✓ 내보내기 완료','✓ 書き出し完了'));}
