function toast(msg,dur){
  var el=document.getElementById('toast-el');
  el.textContent=msg;el.style.display='block';
  clearTimeout(el._t);el._t=setTimeout(function(){el.style.display='none';},dur||2500);

function setStatus(s){
  var dot=document.getElementById('sdot'),txt=document.getElementById('stxt');
  if(s==='conn'){dot.className='sdot saving';txt.textContent=sl('연결 중...','接続中...');}
  else if(s==='ok'){dot.className='sdot';dot.style.background='#2e7d5a';txt.textContent=sl('클라우드 연결됨','クラウド接続済');}
  else if(s==='sav'){dot.className='sdot saving';txt.textContent=sl('저장 중...','保存中...');}
  else if(s==='saved'){dot.className='sdot';dot.style.background='#2e7d5a';txt.textContent=sl('저장됨','保存済');}
  else{dot.className='sdot';dot.style.background='#e05555';txt.textContent='오류';}
}
function badge(status){
  var s=SM[status]||{ko:status,ja:status,color:'#888',bg:'#eee'};
  return '<span class="badge" style="background:'+s.bg+';color:'+s.color+';border:1px solid '+s.color+'44">'+slS(status)+'</span>';
}
function mn(t){return '<code class="mn">'+t+'</code>';}
function nid(){return 'ID-'+Math.random().toString(36).slice(2,8).toUpperCase();}
function fmtDT(dt){
  if(!dt)return '-';
  var d=new Date(dt);if(isNaN(d))return dt;
  var days=['일','월','화','수','목','금','토'];
  var p=function(n){return String(n).padStart(2,'0');};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' ('+days[d.getDay()]+') '+p(d.getHours())+':'+p(d.getMinutes());
}
function getLunar(ds){
  var d=new Date(ds),ep=new Date(1900,0,31).getTime();
  var days=Math.floor((d.getTime()-ep)/86400000),cy=29.53059;
  return{m:Math.floor((days/cy)%12)+1,d:Math.floor(((days/cy)%1)*cy)+1};
}
function kpiCard(icon,title,val,sub,color){
  return '<div class="kcard" style="border-top:3px solid '+color+'"><div class="icon">'+icon+'</div><div class="val" style="color:'+color+'">'+val+'</div><div class="ttl">'+title+'</div><div style="font-size:10px;color:#bbb;margin-top:2px">'+sub+'</div></div>';
}
function updateHdr(){
  var rev=DB.payments.filter(function(p){return p.status==='완료';}).reduce(function(s,p){return s+p.amount;},0);
  var exp=DB.expenses.reduce(function(s,e){return s+e.amount;},0);
  var unp=DB.orders.filter(function(o){return !o.paid;}).length;
  document.getElementById('h-rev').textContent='₩'+rev.toLocaleString();
  document.getElementById('h-exp').textContent='₩'+exp.toLocaleString();
  document.getElementById('h-unp').textContent=unp+sl('건','件');
}

function cm(){document.getElementById('ov').style.display='none';}
async function sbReq(method,table,body,id,q){
  var url=SB+'/rest/v1/'+table+(id?'?id=eq.'+id:(q||''));
  var h={'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Accept':'application/json'};
  if(method==='POST')h['Prefer']='return=representation';
  var r=await fetch(url,{method:method,headers:h,body:body?JSON.stringify(body):null});
  if(!r.ok)throw new Error(await r.text());
  var t=await r.text();return t?JSON.parse(t):[];
}
async function loadAll(){
  setStatus('conn');
  try{
    var o=await sbReq('GET','orders',null,null,'?order=created_at.desc');
    var c=await sbReq('GET','customers',null,null,'?order=created_at.desc');
    var p=await sbReq('GET','payments',null,null,'?order=created_at.desc');
    var e=await sbReq('GET','expenses',null,null,'?order=created_at.desc');
    DB={
      orders:o.map(function(x){return Object.assign({},x,{items:x.items||[],file_urls:x.file_urls||[]});}),
      customers:c,payments:p,expenses:e
    };
    setStatus('ok');updateHdr();go(TAB);
  }catch(ex){
    setStatus('err');
    document.getElementById('mc').innerHTML='<div style="padding:20px;background:#ffeaea;border-radius:10px;color:#e05555;margin:20px"><b>연결 오류</b><br><small>'+ex.message+'</small></div>';
  }
}
function go(tab){
  TAB=tab;
  document.querySelectorAll('nav button').forEach(function(b,i){
    b.className=['dashboard','orders','calendar','customers','payments','expenses','settings'][i]===tab?'active':'';
  });
  var mc=document.getElementById('mc');
  mc.style.animation='none';mc.offsetHeight;mc.style.animation='fadeIn .35s';
  if(tab==='dashboard')renderDB();
  else if(tab==='orders')renderOrders();
  else if(tab==='calendar')renderCal();
  else if(tab==='customers')renderCust();
  else if(tab==='payments')renderPay();
  else if(tab==='expenses')renderExp();
  else if(tab==='settings')renderSet();
}

    +addrLine
    +'<div class="itags">'+items+'</div>'
    +(o.note?'<div class="onote">📝 '+o.note+'</div>':'')
    +'<div class="obot"><strong style="color:#c8832a">₩'+o.total.toLocaleString()+'</strong><div style="display:flex;gap:5px;flex-wrap:wrap"><select class="sel-sm" onchange="updStat(\''+o.id+'\',this.value)">'+sOpts+'</select>'+(!o.paid?'<button class="pay-b" onclick="markPaid(\''+o.id+'\')">'+sl('결제 완료','支払完了')+'</button>':'')+'<button class="prt-b" onclick="printR(\''+o.id+'\')">🖨 '+sl('영수증','領収書')+'</button><button class="edit-b" onclick="viewOrder(\''+o.id+'\')">'+sl('상세','詳細')+'</button><button class="edit-b" style="background:#e3f2fd;color:#1565a8" onclick="editOrder(\''+o.id+'\')">'+sl('수정','修正')+'</button><button class="del-b" onclick="delOrder(\''+o.id+'\')">'+sl('삭제','削除')+'</button></div></div>';

function refreshO(){
  var s=(document.getElementById('os')||{value:''}).value;
  var f=(document.getElementById('of')||{value:'all'}).value;
  var el=document.getElementById('olist');if(!el)return;
  el.innerHTML='';
  var filtered=DB.orders.filter(function(o){return(f==='all'||o.status===f)&&(o.customer_name.indexOf(s)>=0||o.id.indexOf(s)>=0);}).sort(function(a,b){return a.pickup.localeCompare(b.pickup);});
  if(!filtered.length){el.innerHTML='<p style="text-align:center;color:#888;padding:30px">'+sl('주문이 없습니다','注文がありません')+'</p>';return;}
  filtered.forEach(function(o){el.appendChild(oCard(o));});
}

async function updStat(id,status){
  try{setStatus('sav');await sbReq('PATCH','orders',{status:status},id);DB.orders=DB.orders.map(function(o){return o.id===id?Object.assign({},o,{status:status}):o;});setStatus('saved');refreshO();}catch(e){toast('⚠️ '+e.message);}
}
async function markPaid(id){
  try{setStatus('sav');await sbReq('PATCH','orders',{paid:true},id);DB.orders=DB.orders.map(function(o){return o.id===id?Object.assign({},o,{paid:true}):o;});setStatus('saved');updateHdr();refreshO();toast(sl('✓ 결제 완료','✓ 支払完了'));}catch(e){toast('⚠️ '+e.message);}
}
async function delOrder(id){
  if(!confirm(sl('삭제하시겠습니까?','削除しますか？')))return;
  try{setStatus('sav');await sbReq('DELETE','orders',null,id);DB.orders=DB.orders.filter(function(o){return o.id!==id;});setStatus('saved');updateHdr();refreshO();toast(sl('삭제되었습니다','削除しました'));}catch(e){toast('⚠️ '+e.message);}
}

function showSug(){
  var q=(document.getElementById('fn')||{value:''}).value.trim();
  var box=document.getElementById('sug');
  if(!box||!q){if(box)box.style.display='none';return;}
  var hits=DB.customers.filter(function(c){return c.name.indexOf(q)>=0||(c.phone&&c.phone.slice(-4).indexOf(q)>=0);});
  if(!hits.length){box.style.display='none';return;}
  box.innerHTML=hits.map(function(c){return '<div class="sug-item" data-id="'+c.id+'">'+c.name+' <span style="color:#888;font-size:11px">'+c.phone+'</span></div>';}).join('');
  box.style.display='block';
  box.querySelectorAll('.sug-item').forEach(function(el){el.onclick=function(){pickC(el.dataset.id);};});
}

function viewOrder(id){

// CALENDAR
function renderCal(){
  var DAYS=LANG==='ko'?['일','월','화','수','목','금','토']:['日','月','火','水','木','金','土'];
  var MONTHS=LANG==='ko'?['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월']:['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  var fd=new Date(calY,calM,1).getDay(),dim=new Date(calY,calM+1,0).getDate();
  var tod=new Date().toISOString().slice(0,10);
  var byDate={};DB.orders.forEach(function(o){var dk=(o.pickup||'').slice(0,10);if(!byDate[dk])byDate[dk]=[];byDate[dk].push(o);});

    +'<div class="lgrow"><div class="lgi"><div class="lgd" style="background:#e05555"></div>'+sl('공휴일','祝日')+'</div><div class="lgi"><div class="lgd" style="background:#7b1fa2"></div>'+sl('음력 명절','旧暦節句')+'</div><div class="lgi"><div class="lgd" style="background:#2e7d5a"></div>'+sl('오늘','今日')+'</div></div>'
    +'<div class="cal-wrap"><div class="cal-hdr"><button class="cal-nav" onclick="calPrev()">‹</button><span class="cal-title">'+calY+sl('년 ','年')+MONTHS[calM]+'</span><button class="cal-nav" onclick="calNext()">›</button></div><div class="cal-grid" id="cgrid"></div><div id="cdet"></div></div>';
  var grid=document.getElementById('cgrid');
  DAYS.forEach(function(d,i){var el=document.createElement('div');el.className='cal-dh';el.style.color=i===0?'#e05555':i===6?'#1565a8':'#666';el.textContent=d;grid.appendChild(el);});
  for(var i=0;i<fd;i++){var e=document.createElement('div');e.className='cal-empty';grid.appendChild(e);}
  for(var d=1;d<=dim;d++){
    (function(d){
      var ds=calY+'-'+String(calM+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      var hol=HOLIDAYS[ds]||'',lun=LUNAR_F[ds]||'';
      var orders=byDate[ds]||[],isT=ds===tod,isSun=(fd+d-1)%7===0,isSat=(fd+d-1)%7===6,isSel=calSel===ds;
      var lunar=getLunar(ds);
      var el=document.createElement('div');
      el.className='cal-cell';
      el.style.background=isSel?'#fff3e0':isT?'#e8f5e9':'#fff';
      el.style.border=isT?'2px solid #2e7d5a':isSel?'2px solid #c8832a':'1px solid #e8d4b8';
      var html='<div class="cal-date" style="color:'+(hol?'#e05555':isSun?'#e05555':isSat?'#1565a8':'#2a1208')+';font-weight:'+(isT?700:500)+'">'+d+(isT?'<span style="font-size:7px;background:#2e7d5a;color:#fff;border-radius:2px;padding:0 2px;margin-left:2px">'+sl('오늘','今日')+'</span>':'')+'</div><div class="lunar">'+sl('음','陰')+' '+lunar.m+'/'+lunar.d+'</div>'+(hol?'<div class="hol-tag">'+hol+'</div>':'')+(lun&&!hol?'<div class="lun-tag">'+lun+'</div>':'');
      orders.slice(0,2).forEach(function(o){var c=SM[o.status]?SM[o.status].color:'#888';html+='<div class="cal-dot" style="background:'+c+'22;color:'+c+'">'+o.customer_name+'</div>';});
      if(orders.length>2)html+='<div style="font-size:7px;color:#888">+'+(orders.length-2)+sl('건','件')+'</div>';
      el.innerHTML=html;
      el.onclick=function(){calSel=calSel===ds?null:ds;renderCal();};
      grid.appendChild(el);
    })(d);
  }
  if(calSel&&byDate[calSel]){
    var det=document.getElementById('cdet');
    det.innerHTML='<div class="cal-detail"><div class="card-title">'+calSel+' '+sl('주문 목록','注文一覧')+'</div>'+byDate[calSel].map(function(o){return '<div class="cdrow">'+mn(o.id)+'<span>'+o.customer_name+'</span><span>'+(o.items||[]).map(function(it){return it.name+'×'+it.qty;}).join(', ')+'</span>'+badge(o.status)+'<strong style="color:#c8832a">₩'+o.total.toLocaleString()+'</strong><button class="prt-b" onclick="printR(\''+o.id+'\')">🖨</button></div>';}).join('')+'</div>';
  }
}

    +(unpaid.length?'<div class="card"><div class="card-title">'+sl('미결제 주문','未払い注文')+'</div><div id="ulist"></div></div>':'');
  var tbody=document.getElementById('ptbody');
  if(tbody){DB.payments.forEach(function(p){var tr=document.createElement('tr');tr.className='tr';tr.innerHTML='<td>'+mn(p.id)+'</td><td>'+mn(p.order_id)+'</td><td>₩'+p.amount.toLocaleString()+'</td><td>'+p.method+'</td><td>'+p.date+'</td><td style="color:#2e7d5a;font-weight:600">✓ '+p.status+'</td><td></td>';var btn=document.createElement('button');btn.className='del-b';btn.textContent=sl('삭제','削除');btn.onclick=function(){delPay(p.id);};tr.lastChild.appendChild(btn);tbody.appendChild(tr);});}
  var ulist=document.getElementById('ulist');
  if(ulist){unpaid.forEach(function(o){var div=document.createElement('div');div.className='urow';div.innerHTML=mn(o.id)+'<span>'+o.customer_name+'</span><span>'+sl('수령','受取')+': '+fmtDT(o.pickup)+'</span><strong style="color:#e05555">₩'+o.total.toLocaleString()+'</strong>';var btn=document.createElement('button');btn.className='pay-b';btn.textContent='+ '+sl('결제 입력','決済入力');btn.onclick=function(){addPayFor(o.id,o.total);};div.appendChild(btn);ulist.appendChild(div);});}
}
function payFB(oid,amt){return '<div class="fcol"><div><label class="lbl">'+sl('주문번호','注文番号')+'</label><input class="inp" id="poid" value="'+(oid||'')+'"/></div><div><label class="lbl">'+sl('금액 (₩)','金額 (₩)')+'</label><input class="inp" type="number" id="pamt" value="'+(amt||'')+'"/></div><div><label class="lbl">'+sl('결제 수단','決済手段')+'</label><select class="inp" id="pmeth">'+METHS().map(function(m){return '<option>'+m+'</option>';}).join('')+'</select></div><div><label class="lbl">'+sl('날짜','日付')+'</label><input class="inp" type="date" id="pdate" value="'+new Date().toISOString().slice(0,10)+'"/></div></div>';}
function addPay(){om(sl('결제 입력','決済入力'),payFB('',''),'<button class="canbtn" onclick="cm()">'+sl('취소','キャンセル')+'</button><button class="savbtn" onclick="submitPay()">'+sl('저장하기','保存する')+'</button>');}
function addPayFor(id,amt){om(sl('결제 입력','決済入力'),payFB(id,amt),'<button class="canbtn" onclick="cm()">'+sl('취소','キャンセル')+'</button><button class="savbtn" onclick="submitPay()">'+sl('저장하기','保存する')+'</button>');}
async function submitPay(){
  var oid=(document.getElementById('poid')||{}).value.trim(),amt=Number((document.getElementById('pamt')||{}).value);
  if(!oid||!amt){toast(sl('주문번호와 금액을 입력해주세요','注文番号と金額を入力してください'));return;}
  var np={id:nid(),order_id:oid,amount:amt,method:(document.getElementById('pmeth')||{}).value,date:(document.getElementById('pdate')||{}).value,status:'완료'};
  try{setStatus('sav');var r=await sbReq('POST','payments',np);DB.payments.unshift(r[0]||np);await sbReq('PATCH','orders',{paid:true},oid);DB.orders=DB.orders.map(function(o){return o.id===oid?Object.assign({},o,{paid:true}):o;});setStatus('saved');cm();renderPay();updateHdr();toast(sl('✓ 결제가 등록되었습니다','✓ 決済を登録しました'));}catch(e){toast('⚠️ '+e.message);}
}
async function delPay(id){
  if(!confirm(sl('삭제하시겠습니까?','削除しますか？')))return;
  try{setStatus('sav');await sbReq('DELETE','payments',null,id);DB.payments=DB.payments.filter(function(p){return p.id!==id;});setStatus('saved');renderPay();updateHdr();toast(sl('삭제되었습니다','削除しました'));}catch(e){toast('⚠️ '+e.message);}
}

// EXPENSES
function renderExp(){
  var total=DB.expenses.reduce(function(s,e){return s+e.amount;},0);
  var mc=document.getElementById('mc');
  mc.innerHTML='<div class="sh"><h2>🧾 '+sl('경비 관리','経費管理')+'</h2><button class="add-btn" onclick="addExp()">+ '+sl('경비 추가','経費追加')+'</button></div><div class="toolbar"><select class="sel" id="ecatf" onchange="refreshExp()"><option value="">'+sl('전체','全て')+'</option>'+ECATS().map(function(c){return '<option>'+c+'</option>';}).join('')+'</select><div style="font-size:14px;font-weight:700;color:#c8832a;margin-left:auto">'+sl('이번 달 합계','今月合計')+': ₩'+total.toLocaleString()+'</div></div><div id="elist" class="exp-grid"></div>';
  refreshExp();
}
function refreshExp(){
  var cat=(document.getElementById('ecatf')||{value:''}).value;
  var el=document.getElementById('elist');if(!el)return;
  el.innerHTML='';
  var f=cat?DB.expenses.filter(function(e){return e.category===cat;}):DB.expenses;
  if(!f.length){el.innerHTML='<p style="text-align:center;color:#888;padding:30px">'+sl('경비가 없습니다','経費がありません')+'</p>';return;}
  f.forEach(function(e){
    var el2=document.createElement('div');
    el2.className='ecard';
    el2.innerHTML='<div class="ecat">'+e.category+'</div><div class="eitem">'+e.item+'</div><div style="font-size:11px;color:#aaa;margin-bottom:2px">🏪 '+e.vendor+'</div><div style="font-size:11px;color:#ccc;margin-bottom:7px">📅 '+e.date+'</div><div class="eamt">₩'+e.amount.toLocaleString()+'</div>';
    var btn=document.createElement('button');btn.className='delx';btn.textContent='✕';btn.onclick=function(){delExp(e.id);};
    el2.appendChild(btn);el.appendChild(el2);
  });
}
function expFB(){return '<div class="fcol"><div><label class="lbl">'+sl('카테고리','カテゴリ')+'</label><select class="inp" id="ecat">'+ECATS().map(function(c){return '<option>'+c+'</option>';}).join('')+'</select></div><div><label class="lbl">'+sl('품목명','品目名')+'</label><input class="inp" id="eitem"/></div><div><label class="lbl">'+sl('금액 (₩)','金額 (₩)')+'</label><input class="inp" type="number" id="eamt"/></div><div><label class="lbl">'+sl('납품업체','仕入先')+'</label><input class="inp" id="evend"/></div><div><label class="lbl">'+sl('날짜','日付')+'</label><input class="inp" type="date" id="edate" value="'+new Date().toISOString().slice(0,10)+'"/></div></div>';}
function addExp(){om(sl('경비 추가','経費追加'),expFB(),'<button class="canbtn" onclick="cm()">'+sl('취소','キャンセル')+'</button><button class="savbtn" onclick="submitExp()">'+sl('저장하기','保存する')+'</button>');}
async function submitExp(){
  var item=(document.getElementById('eitem')||{}).value.trim(),amt=Number((document.getElementById('eamt')||{}).value);
  if(!item||!amt){toast(sl('품목명과 금액을 입력해주세요','品目名と金額を入力してください'));return;}
  var ne={id:nid(),category:(document.getElementById('ecat')||{}).value,item:item,amount:amt,vendor:(document.getElementById('evend')||{}).value,date:(document.getElementById('edate')||{}).value};
  try{setStatus('sav');var r=await sbReq('POST','expenses',ne);DB.expenses.unshift(r[0]||ne);setStatus('saved');cm();renderExp();updateHdr();toast(sl('✓ 경비가 등록되었습니다','✓ 経費を登録しました'));}catch(e){toast('⚠️ '+e.message);}
}
async function delExp(id){
  if(!confirm(sl('삭제하시겠습니까?','削除しますか？')))return;
  try{setStatus('sav');await sbReq('DELETE','expenses',null,id);DB.expenses=DB.expenses.filter(function(e){return e.id!==id;});setStatus('saved');renderExp();updateHdr();toast(sl('삭제되었습니다','削除しました'));}catch(e){toast('⚠️ '+e.message);}
}

// SETTINGS
function renderSet(){
  var b=getBankInfo();
  document.getElementById('mc').innerHTML='<div class="sh"><h2>⚙️ '+sl('설정','設定')+'</h2></div>'
    +'<div class="notif-card"><div class="ntitle">💬 '+sl('카카오톡 알림 설정','カカオトーク通知設定')+'</div><div class="ndesc">'+sl('카카오 오픈빌더 Webhook URL을 입력하면 주문 접수·결제 완료 시 자동으로 알림을 보냅니다.','カカオオープンビルダーのWebhook URLを入力すると、注文受付・決済完了時に自動通知を送ります。')+'</div><div><label class="lbl">Webhook URL</label><input class="inp" id="kurl" value="'+kakaoWH+'" placeholder="https://..."/></div><div style="display:flex;gap:8px;margin-top:10px"><button class="savbtn" onclick="saveKakao()">'+sl('저장','保存')+'</button><button class="edit-b" onclick="testKakao()">'+sl('테스트 전송','テスト送信')+'</button>'+(kakaoWH?'<button class="del-b" onclick="clearKakao()">'+sl('삭제','削除')+'</button>':'')+'</div></div>'
    +'<div class="notif-card"><div class="ntitle">🏦 '+sl('입금 안내 은행 정보','振込案内 銀行情報')+'</div><div class="ndesc">'+sl('입금 결제 시 안내 메시지에 자동으로 포함됩니다.','振込決済時に案内メッセージに自動で含まれます。')+'</div><div class="fcol"><div><label class="lbl">'+sl('은행명','銀行名')+'</label><input class="inp" id="bbank" value="'+(b.bank||'')+'" placeholder="'+sl('예: 국민은행','例: 国民銀行')+'"/></div><div><label class="lbl">'+sl('계좌번호','口座番号')+'</label><input class="inp" id="bacct" value="'+(b.account||'')+'"/></div><div><label class="lbl">'+sl('예금주','口座名義')+'</label><input class="inp" id="bholder" value="'+(b.holder||'')+'"/></div></div><button class="savbtn" style="margin-top:10px" onclick="saveBank()">'+sl('저장','保存')+'</button></div>'
    +'<div class="card"><div class="card-title">'+sl('데이터 관리','データ管理')+'</div><p style="font-size:13px;color:#888;margin-bottom:12px;line-height:1.7">✅ Supabase '+sl('클라우드 DB에 연결됨. 모든 기기에서 실시간 공유됩니다.','クラウドDBに接続済み。全端末でリアルタイム共有されます。')+'</p><button class="edit-b" onclick="exportData()">📥 '+sl('데이터 내보내기','データ書き出し')+'</button></div>'
    +'<div class="card"><div class="card-title">'+sl('언어 설정','言語設定')+'</div><div style="display:flex;gap:10px"><button class="edit-b" style="'+(LANG==='ko'?'background:#f5ede2;font-weight:700':'')+'" onclick="if(LANG!==\'ko\')toggleLang()">🇰🇷 한국어</button><button class="edit-b" style="'+(LANG==='ja'?'background:#f5ede2;font-weight:700':'')+'" onclick="if(LANG!==\'ja\')toggleLang()">🇯🇵 日本語</button></div></div>';
}
function saveKakao(){kakaoWH=(document.getElementById('kurl')||{}).value.trim();localStorage.setItem('hw_kakao',kakaoWH);toast(sl('✓ 저장되었습니다','✓ 保存しました'));renderSet();}
async function testKakao(){var url=(document.getElementById('kurl')||{}).value.trim();if(!url){toast(sl('URL을 입력해주세요','URLを入力してください'));return;}try{await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:'테스트 메시지입니다 🍡'})});toast(sl('✓ 전송했습니다','✓ 送信しました'));}catch(e){toast('오류: '+e.message);}}
function clearKakao(){kakaoWH='';localStorage.removeItem('hw_kakao');toast(sl('삭제되었습니다','削除しました'));renderSet();}
function saveBank(){var b={bank:(document.getElementById('bbank')||{}).value,account:(document.getElementById('bacct')||{}).value,holder:(document.getElementById('bholder')||{}).value};localStorage.setItem('hw_bank',JSON.stringify(b));toast(sl('✓ 저장되었습니다','✓ 保存しました'));}
function exportData(){var a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(DB,null,2));a.download='haewool_'+new Date().toISOString().slice(0,10)+'.json';a.click();toast(sl('✓ 내보내기 완료','✓ 書き出し完了'));}

// INIT
if(LANG==='ja'){
  document.getElementById('logo-text').textContent='ヘウルトック管理システム';
  document.querySelector('.lbtn').textContent='🌐 한국어';
  document.querySelectorAll('.nl').forEach(function(el){el.textContent=el.dataset.ja;});
  document.getElementById('h-rev-l').textContent='今月売上';
  document.getElementById('h-exp-l').textContent='今月経費';
  document.getElementById('h-unp-l').textContent='未払い';
}
loadAll();
